name: android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    # Testes em C++ do verificador de ROM. Sem ROM no CI: roda só os testes sintéticos.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compilar e rodar testes do verificador
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -O2 -o rom_verifier_test \
            tests/rom_verifier_test.cpp native/rom_verifier/rom_verifier.cpp native/rom_verifier/sha1.cpp
          ./rom_verifier_test

  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar SDK, NDK e CMake
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Compilar APK (debug e release)
        working-directory: android
        run: sh ./gradlew --no-daemon assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: apk-fase2
          path: android/app/build/outputs/apk/**/*.apk

  lus-arm64-probe:
    # Experimento da Fase 2: o libultraship (pin do Shipwright) compila para Android arm64?
    # Não compila o jogo. Registra o log completo, com sucesso ou falha.
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      LUS_COMMIT: da6daf1a50a5e46d6641408d52227e31e85e46df
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: Instalar NDK
        run: sdkmanager --install "ndk;26.1.10909125"
      - name: Baixar libultraship no commit fixado
        run: |
          mkdir lus && cd lus
          git init -q
          git remote add origin https://github.com/kenix3/libultraship.git
          git fetch --depth 1 origin "$LUS_COMMIT"
          git checkout -q FETCH_HEAD
      - name: Configurar e compilar (comandos do README do libultraship)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
          cd lus
          set -o pipefail
          cmake -S . -Bbuild-android -GNinja \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_NDK=$ANDROID_NDK_HOME \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=latest \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_OPENGLES=ON 2>&1 | tee ../lus-configure.log
          cmake --build build-android 2>&1 | tee ../lus-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lus-arm64-logs
          path: |
            lus-configure.log
            lus-build.log
